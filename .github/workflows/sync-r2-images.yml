name: Sync images to Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'public/og-image.jpg'
      - 'public/logo.png'
      - 'scripts/sync-images-to-r2.mjs'
      - '.github/workflows/sync-r2-images.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload Git image backup to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-images-to-r2.mjs
